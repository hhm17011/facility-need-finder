services:
  - type: web
    name: facility-need-finder
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node dist-server/server.mjs
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: KOSIS_API_KEY
        sync: false
